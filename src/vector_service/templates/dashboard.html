<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>vector-service · Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23FFFFFF' stroke='%23E5E7EB' stroke-width='1'/%3E%3Ccircle cx='10' cy='16' r='2' fill='%230891B2'/%3E%3Ccircle cx='16' cy='12' r='2' fill='%230891B2' opacity='.7'/%3E%3Ccircle cx='16' cy='20' r='2' fill='%230891B2' opacity='.7'/%3E%3Ccircle cx='22' cy='16' r='2' fill='%230891B2' opacity='.4'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="{{ url_for('static', path='dashboard/dashboard.css') }}" />
</head>
<body>
<!--
  The dashboard is a Vue 3 single-page app. The #app element below is
  the mount point; the entire UI (topbar / sidebar / main / statusbar)
  is rendered by components/app.js. CSS class names and a few sentinel
  DOM ids (#app, #led-healthz, #led-readyz, #dim-dots, #crumb-cat,
  #crumb-sub) are kept stable for the existing test assertions.
-->
<div id="app"></div>

<!--
  Vue 3 ESM build must be loaded as a module; without
  type="module" the browser parses it as a classic script
  and chokes on the `export { ... }` at the bottom of the
  ESM bundle.
-->
<script type="module" src="{{ url_for('static', path='dashboard/vue.esm-browser.prod.js') }}"></script>
<script type="module" src="{{ url_for('static', path='dashboard/components/app.js') }}"></script>
</body>
</html>
