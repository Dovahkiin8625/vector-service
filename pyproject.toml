[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vector-service"
version = "0.1.0"
description = "Production-grade vector service: OpenAI-compatible embeddings + extensible vector store"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "httpx>=0.27",
    "psutil>=5.9",
    "nvidia-ml-py>=7.0",
    "docling>=2.0",
    "docling-core>=2.0",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "markdownify>=0.13",
    "beautifulsoup4>=4.12",
    "tiktoken>=0.8",
]

[project.optional-dependencies]
embed = [
    "torch>=2.2",
    # GPU build on NVIDIA hosts: the [cuda] extra pulls CUDA 13
    # nvidia-* wheels (cuBLAS/cuFFT/cuRAND/NVRTC; aligned with the
    # cu130 torch in .venv — RTX 5070 Ti / Blackwell needs CUDA 13).
    # No [cudnn] extra: cuDNN comes from torch/lib instead, which keeps
    # a single cuDNN 9 sub-library set in the process (two sets make
    # torch fail with CUDNN_STATUS_SUBLIBRARY_VERSION_MISMATCH).
    # core/cuda_dlls.py registers the DLL directories at startup.
    # macOS stays on the CPU build — the nvidia-* wheels publish no
    # darwin distributions.
    "onnxruntime-gpu[cuda]>=1.29,<2; sys_platform == 'win32' or sys_platform == 'linux'",
    "onnxruntime>=1.18; sys_platform == 'darwin'",
    "FlagEmbedding>=1.2.10",
    "transformers>=4.41",
    "huggingface-hub>=0.23",
    "modelscope>=1.9",
    "sentence-transformers>=2.6",
]
store = [
    "pymilvus>=2.4.3",
]
image-embed = [
    "open_clip_torch>=2.24",
]
multimodal-embed = [
    "transformers>=4.41",
]
all = [
    "vector-service[embed,store,image-embed,multimodal-embed]",
]

[project.scripts]
vector-service = "vector_service.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "contract: contract tests that need a real Milvus server (deselect with '-m \"not contract\"')",
    "slow: slow tests (deselect with '-m \"not slow\"')",
    "integration: full-stack integration tests",
]
filterwarnings = [
    # Treat pymilvus ORM-style API deprecations as test failures so we
    # notice the moment the SDK drops them. The action is "error", the
    # match pattern is the warning message, scoped to our package.
    "error:ORM-style PyMilvus API:DeprecationWarning:vector_service",
    "error:PyMilvusDeprecationWarning:DeprecationWarning:vector_service",
]

[tool.uv]
package = true
