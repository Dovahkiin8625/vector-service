[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vector-service"
version = "0.1.0"
description = "Production-grade vector service: OpenAI-compatible embeddings + extensible vector store"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "httpx>=0.27",
]

[project.optional-dependencies]
embed = [
    "torch>=2.2",
    "onnxruntime>=1.18",
    "FlagEmbedding>=1.2.10",
    "transformers>=4.41",
    "huggingface-hub>=0.23",
    "modelscope>=1.9",
    "sentence-transformers>=2.6",
]
store = [
    "pymilvus>=2.4.3",
]
image-embed = [
    "open_clip_torch>=2.24",
]
multimodal-embed = [
    "transformers>=4.41",
]
all = [
    "vector-service[embed,store,image-embed,multimodal-embed]",
]

[project.scripts]
vector-service = "vector_service.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "contract: contract tests that need a real Milvus server (deselect with '-m \"not contract\"')",
    "slow: slow tests (deselect with '-m \"not slow\"')",
    "integration: full-stack integration tests",
]
filterwarnings = [
    # Treat pymilvus ORM-style API deprecations as test failures so we
    # notice the moment the SDK drops them. The action is "error", the
    # match pattern is the warning message, scoped to our package.
    "error:ORM-style PyMilvus API:DeprecationWarning:vector_service",
    "error:PyMilvusDeprecationWarning:DeprecationWarning:vector_service",
]

[tool.uv]
package = true
