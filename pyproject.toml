[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vector-service"
version = "0.1.0"
description = "Production-grade vector service: OpenAI-compatible embeddings + extensible vector store"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "httpx>=0.27",
    "psutil>=5.9",
    "nvidia-ml-py>=7.0",
    "docling>=2.0",
    "docling-core>=2.0",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "markdownify>=0.13",
    "beautifulsoup4>=4.12",
    "tiktoken>=0.8",
    # multipart/form-data file uploads (/v1/ingest, image embeddings).
    "python-multipart>=0.0.9",
    # ---- vector store (thin derived index) ----
    # Milvus 3.x: sparse vectors written/read directly, and the model
    # helpers (BM25 EF / Analyzer) live in the separate milvus-model
    # package. jieba powers the offline-friendly BM25 analyzer.
    "pymilvus>=3.0.1",
    "milvus-model>=0.2.12",
    "jieba>=0.42",
    # milvus_model.tokenizers imports nltk at module load (even though
    # our explicit jieba Analyzer never needs its stopword data).
    "nltk>=3.9.1",
    # ---- embeddings ----
    # GPU build on NVIDIA hosts: torch comes from the cu130 wheel index
    # (see [tool.uv.sources] below); onnxruntime-gpu[cuda] pulls CUDA 13
    # nvidia-* wheels (cuBLAS/cuFFT/cuRAND/NVRTC — RTX 5070 Ti /
    # Blackwell needs CUDA 13). No separate cuDNN wheel on win32: cuDNN
    # ships inside torch/lib, keeping a single cuDNN 9 sub-library set
    # (two sets make torch fail with CUDNN_STATUS_SUBLIBRARY_VERSION_
    # MISMATCH). core/cuda_dlls.py registers the DLL directories at
    # startup. macOS uses the CPU torch/onnxruntime builds.
    "torch>=2.2",
    "onnxruntime-gpu[cuda]>=1.29,<2; sys_platform == 'win32' or sys_platform == 'linux'",
    "onnxruntime>=1.18; sys_platform == 'darwin'",
    "FlagEmbedding>=1.2.10",
    "transformers>=4.41",
    "huggingface-hub>=0.23",
    "modelscope>=1.9",
    "sentence-transformers>=2.6",
    "open_clip_torch>=2.24",
    "opentelemetry-api>=1.45.0",
    "opentelemetry-sdk>=1.45.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
]

[project.scripts]
vector-service = "vector_service.main:run"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "coverage>=7",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "contract: contract tests that need a real Milvus server (deselect with '-m \"not contract\"')",
    "slow: slow tests (deselect with '-m \"not slow\"')",
    "integration: full-stack integration tests",
]
filterwarnings = [
    # Treat pymilvus ORM-style API deprecations as test failures so we
    # notice the moment the SDK drops them. The action is "error", the
    # match pattern is the warning message, scoped to our package.
    "error:ORM-style PyMilvus API:DeprecationWarning:vector_service",
    "error:PyMilvusDeprecationWarning:DeprecationWarning:vector_service",
]

[tool.uv]
package = true
# milvus-model and rapidocr hard-require the CPU ``onnxruntime`` wheel,
# but on win32/linux the embed extra ships onnxruntime-gpu — both
# packages install into the same ``onnxruntime`` namespace, so a second
# CPU wheel clobbers the GPU provider's files (DLLs / .so). Keep
# onnxruntime only on macOS, where the embed extra uses the plain build.
override-dependencies = [
    "onnxruntime; sys_platform == 'darwin'",
]

# GPU torch comes from the official CUDA 13 wheel index, not PyPI (where
# torch is the CPU build). docling's standard extra also requires torch,
# so routing the package here keeps every consumer on the same GPU wheel.
# Explicit index: only packages that name this source use it.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
